<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Inveris Digital</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter+Tight:wght@300;400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0A1733; --teal: #14B8A6; --teal-bright: #2DD4BF;
      --ice: #CADCFC; --muted: #94A3B8; --white: #fff;
      --border-soft: #1F2E4A;
      --f-display: "Fraunces", Georgia, serif;
      --f-body: "Inter Tight", -apple-system, sans-serif;
      --f-mono: "JetBrains Mono", monospace;
    }
    *,*:before,*:after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: var(--f-body); background: var(--navy); color: var(--ice); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 560px; text-align: center; }
    .eyebrow { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .18em; text-transform: uppercase; color: var(--teal); margin-bottom: 1.5rem; }
    h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(3rem, 8vw, 5rem); color: var(--white); line-height: 1; margin: 0 0 1.5rem; letter-spacing: -.02em; }
    h1 em { font-style: italic; color: var(--teal-bright); font-weight: 500; }
    p { font-size: 1.1rem; color: var(--ice); margin: 0 0 2rem; line-height: 1.55; }
    a.btn { display: inline-flex; align-items: center; gap: .55rem; padding: .85rem 1.5rem; background: var(--teal); color: var(--navy); font-weight: 500; text-decoration: none; border-radius: 2px; transition: all .18s cubic-bezier(.16,1,.3,1); }
    a.btn:hover { background: var(--teal-bright); transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">404 — Not Found</div>
    <h1>The page you're looking for <em>wandered off</em>.</h1>
    <p>It happens. Let's get you back to something useful.</p>
    <a href="/" class="btn">Return home →</a>
  </div>
</body>
</html>
